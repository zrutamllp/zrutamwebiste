# Builds the static site and uploads out/ to Hostinger over FTP.
#   - Push to main  -> build + deploy (live)
#   - Pull request  -> build only (catches a broken build before it merges)
#   - Actions tab   -> "Run workflow" to redeploy main by hand
#
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional repo variables: FTP_SERVER_DIR (default "public_html/"),
# FTP_PROTOCOL (default "ftps"; set to "ftp" if the TLS connection fails).
# Setup steps are in DEPLOY.md.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check the export looks complete
        run: |
          for f in index.html .htaccess 404.html sitemap.xml solutions/posh/index.html; do
            test -f "out/$f" || { echo "::error::out/$f is missing"; exit 1; }
          done
          if grep -q "Page Not Found" out/blog/why-idps-fail-and-how-to-fix-them/index.html; then
            echo "::error::blog posts render as 404"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.zrutam.com/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/

      # Uploads only files that changed since the last deploy (tracked in
      # .ftp-deploy-sync-state.json on the server). It never deletes files
      # that were already on the server before the first automated deploy.
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          timeout: 120000
